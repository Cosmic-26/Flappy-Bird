<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>100 Tiny Games</title>
  <link rel="stylesheet" href="games.css">
</head>
<body class="arcade">
  <header class="arcade-header">
    <div><p class="kicker">The little arcade</p><h1>100 tiny games.</h1></div>
    <p class="intro">A shelf of quick-play experiments. Choose a title, then tap or press Space to move.</p>
  </header>
  <main class="game-grid" id="game-grid"></main>
  <script>
    const names = ['neon-drift', 'orbital-dash', 'cinder-run', 'moon-miner', 'pixel-current', 'star-hopper', 'echo-valley', 'crystal-dodge', 'solar-sprint', 'cloud-circuit'];
    const labels = ['Neon Drift', 'Orbital Dash', 'Cinder Run', 'Moon Miner', 'Pixel Current', 'Star Hopper', 'Echo Valley', 'Crystal Dodge', 'Solar Sprint', 'Cloud Circuit'];
    const grid = document.querySelector('#game-grid');
    for (let index = 1; index <= 100; index += 1) {
      const type = (index - 1) % names.length;
      const level = Math.ceil(index / 10);
      const name = `${labels[type]} ${level}`;
      grid.insertAdjacentHTML('beforeend', `<a class="game-card" href="${names[type]}-${level}.html"><span class="game-number">${String(index).padStart(2, '0')}</span><h2>${name}</h2><p>Quick reflex challenge</p></a>`);
    }
  </script>
</body>
</html>
