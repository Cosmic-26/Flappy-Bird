<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>100 Tiny Games</title>
  <style>
    :root { color-scheme: dark; --ink: #f5f2e8; --muted: #a8b0b2; --accent: #ffcf5a; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { color: var(--ink); background: #101820; font-family: Georgia, "Times New Roman", serif; }
    button { font: inherit; }
    .app { min-height: 100vh; padding: 24px; background: radial-gradient(circle at 50% 0, rgba(255,207,90,.16), transparent 42%), #101820; }
    header { width: min(100%, 1120px); margin: 0 auto; padding: 20px 0 28px; }
    .kicker { margin: 0 0 8px; color: var(--accent); font: 700 11px Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(38px, 7vw, 76px); font-weight: 400; line-height: .95; }
    .intro { max-width: 470px; margin: 16px 0 0; color: var(--muted); font: 15px/1.6 Arial, sans-serif; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 12px; width: min(100%, 1120px); margin: 0 auto; }
    .game-card { min-height: 132px; padding: 17px; border: 1px solid rgba(255,255,255,.13); border-radius: 8px; color: var(--ink); background: rgba(15,22,30,.82); cursor: pointer; text-align: left; transition: transform .18s ease, border-color .18s ease, background .18s ease; }
    .game-card:hover, .game-card:focus-visible { transform: translateY(-3px); border-color: var(--accent); background: rgba(255,255,255,.1); outline: none; }
    .number { color: var(--accent); font: 700 11px Arial, sans-serif; letter-spacing: 1px; }
    .game-card strong { display: block; margin-top: 22px; font-size: 20px; font-weight: 400; }
    .game-card small { display: block; margin-top: 7px; color: var(--muted); font: 12px Arial, sans-serif; }
    .screen { display: none; place-items: center; min-height: calc(100vh - 48px); }
    .screen.active { display: grid; }
    .game-panel { width: min(100%, 760px); padding: 20px; border: 1px solid rgba(255,255,255,.14); border-radius: 8px; background: rgba(15,22,30,.86); }
    .game-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .game-top h2 { margin: 0; font-size: clamp(28px, 6vw, 56px); font-weight: 400; }
    .actions { display: flex; align-items: center; gap: 14px; }
    .back { border: 0; color: var(--muted); background: transparent; cursor: pointer; font: 700 12px Arial, sans-serif; }
    .back:hover { color: var(--accent); }
    canvas { display: block; width: 100%; aspect-ratio: 16 / 10; border-radius: 5px; background: #192732; touch-action: manipulation; }
    .help { margin: 14px 0 0; color: var(--muted); font: 13px/1.5 Arial, sans-serif; }
    @media (max-width: 620px) { .app { padding: 16px; } .game-panel { padding: 12px; } }
  </style>
</head>
<body>
  <main class="app" id="menu">
    <header><p class="kicker">The little arcade</p><h1>100 tiny games.</h1><p class="intro">Everything is inside this one HTML file. Pick a game, then tap or press Space.</p></header>
    <section class="grid" id="grid" aria-label="Game list"></section>
  </main>
  <main class="app screen" id="screen">
    <section class="game-panel">
      <header class="game-top"><h2 id="game-title"></h2><div class="actions"><button class="back" id="restart" type="button">Restart</button><button class="back" id="back" type="button">All games</button></div></header>
      <canvas id="canvas" aria-label="Playable game"></canvas>
      <p class="help" id="help"></p>
    </section>
  </main>
  <script>
    (() => {
      const titles = ['Neon Drift','Orbit Catcher','Cinder Climb','Moon Miner','Pixel Current','Star Hopper','Echo Valley','Crystal Dodge','Solar Sprint','Cloud Circuit','Lantern Keeper','Comet Courier','Tidal Tiles','Magnet Maze','Rocket Garden','Frostline','Signal Jam','Prism Painter','Volcano Dash','Quiet Orbit','Asteroid Post','Bamboo Bounce','Circuit Chef','Deep Sea Scan','Ember Stack','Garden Patrol','Gravity Well','Honeycomb Hunt','Ink Runner','Jelly Jump','Kite Chase','Lunar Landing','Meteor Match','Night Train','Ocean Pulse','Paper Plane','Quasar Quest','River Rapids','Signal Tower','Thunder Road','Umbra Runner','Vapor Vault','Wave Rider','Xeno Garden','Yonder Yard','Zen Blocks','Aurora Aim','Bubble Forge','Canyon Climber','Dusk Defender','Evergreen Escape','Firefly Field','Glass Garden','Harbor Hop','Icebox Invaders','Jungle Jive','Kinetic Keys','Laser Lagoon','Mosaic Moon','Nova Nest','Opal Outpost','Plasma Picnic','Quartz Rally','Rainmaker','Sunset Switch','Telescope Town','Underwater Uplink','Velvet Volcano','Windmill Works','Xylophone Sky','Yellow Jacket','Zigzag Zenith','Apple Arcade','Brass Beacon','Copper Canyon','Dragonfly Drift','Electric Eel','Foxfire','Gold Rush','Horizon Hop','Iron Island','Jade Jumper','Kindle Knights','Lighthouse Loop','Maple Meteor','Nectar Navigator','Oxbow Outrun','Pinecone Panic','Quill Quest','Rust Rocket','Sapphire Slide','Topaz Tunnel','Umber Uplink','Violet Voyage','Wildwood Wheels','X-ray Express','Yarn Yard','Zephyr Zone','Final Frontier','Last Light'];
      const types = ['runner','breakout','shooter','memory','snake','aim','stack','maze','pong','typing'];
      const descriptions = ['Jump over the oncoming barriers and survive the course.','Bounce the ball to clear every brick.','Move and shoot down the incoming formation.','Watch the light sequence, then repeat it.','Steer the snake and collect the food.','Click the moving targets before time runs out.','Drop each moving block onto the growing tower.','Find the exit through a generated maze.','Keep the ball in play and beat the rival paddle.','Type each word before the timer expires.'];
      const menu = document.querySelector('#menu'), screen = document.querySelector('#screen'), grid = document.querySelector('#grid');
      const canvas = document.querySelector('#canvas'), context = canvas.getContext('2d'), title = document.querySelector('#game-title'), help = document.querySelector('#help');
      const keys = new Set();
      let width = 800, height = 500, gameNumber = 1, mode, tier, state, frameId, previous = 0, elapsed = 0, score = 0, ended = false, seed = 1, flashPad = -1, timers = [];
      const random = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const gridButtons = titles.map((name, index) => { const button = document.createElement('button'); button.className = 'game-card'; button.type = 'button'; button.innerHTML = `<span class="number">${String(index + 1).padStart(2, '0')} · ${types[index % 10]}</span><strong>${name}</strong><small>${descriptions[index % 10]}</small>`; button.addEventListener('click', () => start(index + 1)); grid.appendChild(button); return button; });
      function resize() { const ratio = Math.min(devicePixelRatio || 1, 2), bounds = canvas.getBoundingClientRect(); canvas.width = Math.round(bounds.width * ratio); canvas.height = Math.round(bounds.height * ratio); context.setTransform(canvas.width / 800, 0, 0, canvas.height / 500, 0, 0); }
      function start(number) { gameNumber = number; mode = types[(number - 1) % 10]; tier = Math.floor((number - 1) / 10) + 1; seed = number * 733; menu.style.display = 'none'; screen.classList.add('active'); title.textContent = `${String(number).padStart(2, '0')} · ${titles[number - 1]}`; help.textContent = descriptions[(number - 1) % 10]; resize(); setup(); previous = performance.now(); cancelAnimationFrame(frameId); frameId = requestAnimationFrame(frame); }
      function setup() {
        timers.forEach(clearTimeout); timers = []; elapsed = 0; score = 0; ended = false; state = {};
        if (mode === 'runner') Object.assign(state, { y: 390, vy: 0, obstacles: [], spawn: 1, jump: false });
        if (mode === 'breakout') Object.assign(state, { ball: { x: 400, y: 330, vx: 190 + tier * 7, vy: -220 }, paddle: 350, bricks: Array.from({ length: 45 }, (_, i) => ({ x: 40 + (i % 9) * 80, y: 70 + Math.floor(i / 9) * 28, live: true })), lives: 3 });
        if (mode === 'shooter') Object.assign(state, { x: 400, y: 430, shots: [], foes: Array.from({ length: 8 + tier }, (_, i) => ({ x: 100 + (i % 8) * 85, y: 65 + Math.floor(i / 8) * 52, live: true })), fire: 0 });
        if (mode === 'memory') { state.pads = Array.from({ length: 4 }, (_, i) => ({ x: 240 + (i % 2) * 165, y: 150 + Math.floor(i / 2) * 165, color: ['#ff6868','#57c7ff','#ffe16a','#75dd92'][i] })); state.sequence = Array.from({ length: 3 + tier }, () => Math.floor(random() * 4)); state.input = 0; state.locked = true; showSequence(); }
        if (mode === 'snake') Object.assign(state, { body: [{ x: 10, y: 8 }, { x: 9, y: 8 }, { x: 8, y: 8 }], dir: { x: 1, y: 0 }, next: { x: 1, y: 0 }, food: { x: 4 + Math.floor(random() * 12), y: 3 + Math.floor(random() * 9) }, tick: 0 });
        if (mode === 'aim') Object.assign(state, { target: newTarget(), hits: 0, time: 35 + tier * 2 });
        if (mode === 'stack') Object.assign(state, { blocks: [{ x: 300, y: 420, w: 200 }], x: 0, direction: 1, width: 200, layer: 0 });
        if (mode === 'maze') { state.maze = makeMaze(15, 9); state.cell = { x: 0, y: 0 }; state.exit = { x: 14, y: 8 }; }
        if (mode === 'pong') Object.assign(state, { py: 210, ay: 210, ball: { x: 400, y: 250, vx: 250, vy: 150 }, points: 0, rival: 0 });
        if (mode === 'typing') Object.assign(state, { words: ['comet','silver','garden','rocket','ocean','lantern','pixel','thunder','crystal','orbit','maple','signal','velvet','meteor','canyon','firefly'], word: '', typed: '', time: 45 + tier * 2 });
        if (mode === 'typing') nextWord();
      }
      function showSequence() { state.locked = true; state.input = 0; let step = 0; const pulse = () => { if (ended || mode !== 'memory') return; if (step >= state.sequence.length) { flashPad = -1; state.locked = false; return; } flashPad = state.sequence[step++]; timers.push(setTimeout(() => { flashPad = -1; timers.push(setTimeout(pulse, 180)); }, 430)); }; timers.push(setTimeout(pulse, 550)); }
      function newTarget() { return { x: 80 + random() * 640, y: 90 + random() * 340, r: Math.max(18, 34 - tier), life: 1.5 }; }
      function makeMaze(cols, rows) { const cells = Array.from({ length: rows }, () => Array.from({ length: cols }, () => ({ n: true, e: true, s: true, w: true, seen: false }))); const stack = [[0,0]]; cells[0][0].seen = true; while (stack.length) { const [x,y] = stack[stack.length - 1], candidates = [[x,y-1,'n','s'],[x+1,y,'e','w'],[x,y+1,'s','n'],[x-1,y,'w','e']].filter(([nx,ny]) => nx >= 0 && nx < cols && ny >= 0 && ny < rows && !cells[ny][nx].seen); if (!candidates.length) { stack.pop(); continue; } const [nx,ny,wall,opposite] = candidates[Math.floor(random() * candidates.length)]; cells[y][x][wall] = false; cells[ny][nx][opposite] = false; cells[ny][nx].seen = true; stack.push([nx,ny]); } return cells; }
      function end(won, message) { if (ended) return; ended = true; state.result = won ? 'YOU WIN' : 'GAME OVER'; state.message = message || (won ? 'Nice run. Press Enter to play again.' : 'Press Enter to try again.'); }
      function frame(now) { const dt = Math.min((now - previous) / 1000, .04); previous = now; if (!ended) { elapsed += dt; update(dt); } draw(); frameId = requestAnimationFrame(frame); }
      function update(dt) {
        if (mode === 'runner') { state.vy += 1250 * dt; state.y += state.vy * dt; if ((keys.has('Space') || state.jump) && state.y >= 390) { state.vy = -510; state.jump = false; } state.spawn -= dt; if (state.spawn <= 0) { state.obstacles.push({ x: 830, h: 35 + random() * 60 }); state.spawn = Math.max(.65, 1.35 - tier * .05 + random() * .5); } state.obstacles.forEach(o => o.x -= (300 + tier * 22) * dt); state.obstacles = state.obstacles.filter(o => o.x > -50); score = Math.floor(elapsed); if (state.y > 390) { state.y = 390; state.vy = 0; } if (state.obstacles.some(o => o.x < 145 && o.x + 34 > 105 && state.y + 38 > 430 - o.h)) end(false); if (elapsed >= 20 + tier * 2) end(true); }
        if (mode === 'breakout') { const b = state.ball; state.paddle = clamp(state.paddle + ((keys.has('ArrowRight') ? 1 : 0) - (keys.has('ArrowLeft') ? 1 : 0)) * 460 * dt, 0, 700); b.x += b.vx * dt; b.y += b.vy * dt; if (b.x < 10 || b.x > 790) b.vx *= -1; if (b.y < 48) b.vy = Math.abs(b.vy); if (b.y > 455 && b.y < 468 && b.x > state.paddle - 5 && b.x < state.paddle + 105) { b.vy = -Math.abs(b.vy); b.vx += (b.x - state.paddle - 50) * 1.3; } if (b.y > 510) { state.lives--; b.x = 400; b.y = 340; b.vy = -220; if (state.lives <= 0) end(false); } state.bricks.forEach(brick => { if (brick.live && b.x > brick.x && b.x < brick.x + 66 && b.y > brick.y && b.y < brick.y + 18) { brick.live = false; b.vy *= -1; score++; } }); if (state.bricks.every(brick => !brick.live)) end(true); }
        if (mode === 'shooter') { state.x = clamp(state.x + ((keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0)) * 340 * dt, 24, 776); state.y = clamp(state.y + ((keys.has('ArrowDown') || keys.has('KeyS') ? 1 : 0) - (keys.has('ArrowUp') || keys.has('KeyW') ? 1 : 0)) * 270 * dt, 220, 475); state.fire -= dt; if (keys.has('Space') && state.fire <= 0) { state.shots.push({ x: state.x, y: state.y - 15 }); state.fire = .24; } state.shots.forEach(s => s.y -= 430 * dt); state.shots = state.shots.filter(s => s.y > 30); state.foes.forEach((foe,i) => { if (foe.live) { foe.x += Math.sin(elapsed * 1.1 + i) * (22 + tier * 2) * dt; foe.y += (Math.sin(elapsed * .7 + i * 2) + 1) * 7 * dt; state.shots.forEach(s => { if (Math.hypot(s.x - foe.x, s.y - foe.y) < 23) { foe.live = false; s.y = -100; score++; } }); if (foe.y > 425) end(false); } }); if (state.foes.every(f => !f.live)) end(true); }
        if (mode === 'snake') { state.tick += dt; if (state.tick > Math.max(.075, .16 - tier * .007)) { state.tick = 0; if (state.next.x !== -state.dir.x || state.next.y !== -state.dir.y) state.dir = state.next; const head = { x: state.body[0].x + state.dir.x, y: state.body[0].y + state.dir.y }; if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 14 || state.body.some(p => p.x === head.x && p.y === head.y)) return end(false); state.body.unshift(head); if (head.x === state.food.x && head.y === state.food.y) { score++; state.food = { x: Math.floor(random() * 20), y: Math.floor(random() * 14) }; if (score >= 8 + tier) end(true); } else state.body.pop(); } }
        if (mode === 'aim') { state.time -= dt; state.target.life -= dt; if (state.target.life <= 0) state.target = newTarget(); score = state.hits; if (state.time <= 0) end(state.hits >= 6 + tier, `${state.hits} targets hit.`); }
        if (mode === 'stack') { state.x += state.direction * (210 + tier * 18) * dt; if (state.x < 0 || state.x + state.width > 800) state.direction *= -1; if (state.layer >= 12 + tier) end(true); }
        if (mode === 'maze') { if (state.cell.x === state.exit.x && state.cell.y === state.exit.y) end(true); }
        if (mode === 'pong') { const b = state.ball; state.py = clamp(state.py + ((keys.has('ArrowDown') || keys.has('KeyS') ? 1 : 0) - (keys.has('ArrowUp') || keys.has('KeyW') ? 1 : 0)) * 380 * dt, 15, 405); state.ay += clamp(b.y - 55 - state.ay, -260 * dt, 260 * dt); b.x += b.vx * dt; b.y += b.vy * dt; if (b.y < 12 || b.y > 488) b.vy *= -1; if (b.x < 55 && b.x > 35 && b.y > state.py && b.y < state.py + 95) b.vx = Math.abs(b.vx) * 1.04; if (b.x > 745 && b.x < 765 && b.y > state.ay && b.y < state.ay + 95) b.vx = -Math.abs(b.vx) * 1.03; if (b.x < 0) { state.rival++; resetBall(-1); } if (b.x > 800) { state.points++; score = state.points; resetBall(1); } if (state.points >= 5 + Math.floor(tier / 2)) end(true); if (state.rival >= 5) end(false); }
        if (mode === 'typing') { state.time -= dt; if (state.time <= 0) end(state.words.length === 0, `${score} words completed.`); }
      }
      function resetBall(direction) { state.ball = { x: 400, y: 250, vx: 250 * direction, vy: (random() - .5) * 320 }; }
      function draw() { const bg = context.createLinearGradient(0, 0, 800, 500); bg.addColorStop(0, '#263b48'); bg.addColorStop(1, '#101820'); context.fillStyle = bg; context.fillRect(0, 0, 800, 500); context.fillStyle = '#fff'; context.font = '700 17px Arial'; context.fillText(`${titles[gameNumber - 1]}  ·  ${Math.floor(score)}`, 22, 30); context.font = '13px Arial'; context.fillStyle = '#b9c2c4'; context.fillText(`CHALLENGE ${tier} / 10`, 22, 52); drawGame(); if (ended) { context.fillStyle = 'rgba(5,10,15,.72)'; context.fillRect(0, 0, 800, 500); context.textAlign = 'center'; context.fillStyle = '#ffcf5a'; context.font = '700 34px Georgia'; context.fillText(state.result, 400, 235); context.fillStyle = '#fff'; context.font = '15px Arial'; context.fillText(state.message, 400, 270); context.textAlign = 'start'; } }
      function drawGame() {
        if (mode === 'runner') { context.fillStyle = '#58716b'; context.fillRect(0, 430, 800, 70); context.fillStyle = '#ffcf5a'; context.fillRect(105, state.y, 40, 40); context.fillStyle = '#ff6c5b'; state.obstacles.forEach(o => context.fillRect(o.x, 430 - o.h, 34, o.h)); context.fillStyle = '#a8b0b2'; context.fillText('SPACE / TAP TO JUMP', 600, 30); }
        if (mode === 'breakout') { state.bricks.forEach((b,i) => { if (b.live) { context.fillStyle = ['#ff6c5b','#ffcf5a','#70e1a0','#65c8ff','#b39aff'][Math.floor(i / 9)]; context.fillRect(b.x, b.y, 66, 18); } }); context.fillStyle = '#fff'; context.fillRect(state.paddle, 465, 100, 12); context.beginPath(); context.arc(state.ball.x, state.ball.y, 8, 0, 7); context.fill(); context.fillText(`LIVES ${state.lives}`, 700, 30); }
        if (mode === 'shooter') { context.fillStyle = '#70e1a0'; context.beginPath(); context.moveTo(state.x, state.y - 18); context.lineTo(state.x - 15, state.y + 14); context.lineTo(state.x + 15, state.y + 14); context.fill(); context.fillStyle = '#ffcf5a'; state.shots.forEach(s => context.fillRect(s.x - 3, s.y, 6, 13)); context.fillStyle = '#ff6c5b'; state.foes.forEach(f => { if (f.live) { context.beginPath(); context.arc(f.x, f.y, 13, 0, 7); context.fill(); } }); }
        if (mode === 'memory') { context.fillStyle = '#fff'; context.fillText(`Sequence length ${state.sequence.length} · Input ${state.input}/${state.sequence.length}`, 270, 70); state.pads.forEach((p,i) => { context.globalAlpha = flashPad === i ? 1 : .55; context.fillStyle = p.color; context.fillRect(p.x, p.y, 145, 145); }); context.globalAlpha = 1; }
        if (mode === 'snake') { const cell = 32; context.fillStyle = '#70e1a0'; state.body.forEach(p => context.fillRect(80 + p.x * cell, 70 + p.y * cell, cell - 2, cell - 2)); context.fillStyle = '#ff6c5b'; context.fillRect(80 + state.food.x * cell, 70 + state.food.y * cell, cell - 2, cell - 2); }
        if (mode === 'aim') { context.fillStyle = '#ff6c5b'; context.beginPath(); context.arc(state.target.x, state.target.y, state.target.r, 0, 7); context.fill(); context.strokeStyle = '#fff'; context.lineWidth = 3; context.beginPath(); context.arc(state.target.x, state.target.y, state.target.r * .48, 0, 7); context.stroke(); context.fillStyle = '#fff'; context.fillText(`HITS ${state.hits}/${6 + tier}     TIME ${Math.ceil(state.time)}`, 580, 30); }
        if (mode === 'stack') { state.blocks.forEach((b,i) => { context.fillStyle = `hsl(${(i * 31 + gameNumber * 7) % 360} 70% 60%)`; context.fillRect(b.x, b.y, b.w, 28); }); context.fillStyle = '#ffcf5a'; context.fillRect(state.x, 392 - state.layer * 28, state.width, 28); context.fillStyle = '#fff'; context.fillText(`STACK ${state.layer}/${12 + tier}`, 650, 30); }
        if (mode === 'maze') drawMaze();
        if (mode === 'pong') { context.fillStyle = '#fff'; context.fillRect(35, state.py, 14, 95); context.fillRect(751, state.ay, 14, 95); context.beginPath(); context.arc(state.ball.x, state.ball.y, 9, 0, 7); context.fill(); context.fillText(`${state.points} : ${state.rival}`, 380, 35); }
        if (mode === 'typing') { context.textAlign = 'center'; context.fillStyle = '#ffcf5a'; context.font = '700 48px Georgia'; context.fillText(state.word, 400, 245); context.fillStyle = '#fff'; context.font = '30px Arial'; context.fillText(state.typed, 400, 295); context.fillStyle = '#b9c2c4'; context.font = '16px Arial'; context.fillText(`WORDS ${score}     TIME ${Math.ceil(state.time)}`, 400, 350); context.textAlign = 'start'; }
      }
      function drawMaze() { const m = state.maze, size = 42, ox = 85, oy = 72; m.forEach((row,y) => row.forEach((c,x) => { const px = ox + x * size, py = oy + y * size; context.strokeStyle = '#b9c2c4'; context.lineWidth = 2; if (c.n) line(px,py,px+size,py); if (c.w) line(px,py,px,py+size); if (x === 14 && c.e) line(px+size,py,px+size,py+size); if (y === 8 && c.s) line(px,py+size,px+size,py+size); })); context.fillStyle = '#70e1a0'; context.fillRect(ox + 14*size + 8, oy + 8*size + 8, 26, 26); context.fillStyle = '#ffcf5a'; context.fillRect(ox + state.cell.x*size + 9, oy + state.cell.y*size + 9, 24, 24); }
      function line(x1,y1,x2,y2) { context.beginPath(); context.moveTo(x1,y1); context.lineTo(x2,y2); context.stroke(); }
      function pointerPosition(event) { const rect = canvas.getBoundingClientRect(); return { x: (event.clientX - rect.left) * 800 / rect.width, y: (event.clientY - rect.top) * 500 / rect.height }; }
      function pressPad(index) { if (state.locked || ended) return; if (state.sequence[state.input] !== index) return end(false, 'Wrong pad. Press Enter to retry.'); state.input++; if (state.input >= state.sequence.length) { score++; if (score >= 3 + Math.floor(tier / 3)) return end(true, 'Perfect memory!'); state.sequence.push(Math.floor(random() * 4)); showSequence(); } }
      function moveMaze(dx,dy) { const { x,y } = state.cell, cell = state.maze[y][x]; if (dx === 1 && !cell.e || dx === -1 && !cell.w || dy === 1 && !cell.s || dy === -1 && !cell.n) { state.cell = { x: x + dx, y: y + dy }; score++; } }
      function nextWord() { const index = Math.floor(random() * state.words.length); state.word = state.words.splice(index, 1)[0]; state.typed = ''; }
      grid.addEventListener('click', () => {});
      document.querySelector('#restart').addEventListener('click', () => start(gameNumber));
      document.querySelector('#back').addEventListener('click', () => { cancelAnimationFrame(frameId); timers.forEach(clearTimeout); keys.clear(); screen.classList.remove('active'); menu.style.display = ''; });
      canvas.addEventListener('pointermove', event => { const p = pointerPosition(event); if (mode === 'breakout') state.paddle = clamp(p.x - 50, 0, 700); if (mode === 'pong') state.py = clamp(p.y - 47, 0, 405); });
      canvas.addEventListener('pointerdown', event => { const p = pointerPosition(event); if (ended) return; if (mode === 'runner') { state.jump = true; return; } if (mode === 'memory') { const pad = state.pads.findIndex(item => p.x >= item.x && p.x <= item.x + 145 && p.y >= item.y && p.y <= item.y + 145); if (pad >= 0) pressPad(pad); return; } if (mode === 'aim' && Math.hypot(p.x - state.target.x, p.y - state.target.y) < state.target.r) { state.hits++; score = state.hits; if (state.hits >= 6 + tier) end(true, 'Bullseye!'); else state.target = newTarget(); } if (mode === 'stack') dropBlock(); });
      function dropBlock() { const previousBlock = state.blocks[state.blocks.length - 1], x = state.x, left = Math.max(x, previousBlock.x), right = Math.min(x + state.width, previousBlock.x + previousBlock.w), overlap = right - left; if (overlap < 18) return end(false, 'The tower fell. Press Enter to retry.'); state.layer++; state.width = overlap; state.blocks.push({ x: left, y: 392 - state.layer * 28, w: overlap }); state.x = 0; state.direction = 1; score = state.layer; }
      window.addEventListener('keydown', event => { if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.code)) event.preventDefault(); if (ended && (event.code === 'Enter' || event.code === 'Space')) { start(gameNumber); return; } keys.add(event.code); if (mode === 'runner' && event.code === 'Space') state.jump = true; if (mode === 'stack' && event.code === 'Space') dropBlock(); if (mode === 'maze') { if (event.code === 'ArrowUp') moveMaze(0,-1); if (event.code === 'ArrowDown') moveMaze(0,1); if (event.code === 'ArrowLeft') moveMaze(-1,0); if (event.code === 'ArrowRight') moveMaze(1,0); } if (mode === 'snake') { if (event.code === 'ArrowUp') state.next = {x:0,y:-1}; if (event.code === 'ArrowDown') state.next = {x:0,y:1}; if (event.code === 'ArrowLeft') state.next = {x:-1,y:0}; if (event.code === 'ArrowRight') state.next = {x:1,y:0}; } if (mode === 'typing' && event.key.length === 1 && /[a-z]/i.test(event.key)) { const expected = state.word[state.typed.length]; if (event.key.toLowerCase() === expected) state.typed += expected; else state.typed = ''; if (state.typed === state.word) { score++; if (!state.words.length) return end(true, 'You typed every word!'); nextWord(); } } });
      window.addEventListener('keyup', event => keys.delete(event.code));
      window.addEventListener('blur', () => keys.clear());
      window.addEventListener('resize', resize);
    })();
  </script>
</body>
